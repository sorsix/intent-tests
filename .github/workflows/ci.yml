# Checks every push and pull request of the public intent-tests repository. Inert in the internal monorepo: the sync
# (scripts/release/engine-sync.mjs) moves engine/.github to the public repository's root, where engine/ is a folder.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: engine

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # The demo clinic in a real browser with the offline stub decider: no API key, no dashboard.
      - run: npm run test:self
